<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hűtő Mágus</title>
<meta name="description" content="Fotózd le a hűtőd, és kapj egy gusztusos receptet pillanatok alatt.">
<meta name="theme-color" content="#E05638">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hűtő Mágus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paprika:#E05638; --paprika-dark:#B8402A; --cream:#FBF1E4; --plate:#FDE3C8;
  --plum:#3A2418; --herb:#6B8E4E; --herb-dark:#4F6B38; --line:#EBD7B8;
  color-scheme: light;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--plum);font-family:'Nunito',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header{padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:22px;margin:0;}
header h1 span{color:var(--paprika);}
main{flex:1;padding:0 20px 40px;}

/* ---- Telepítés ---- */
.install-banner{background:var(--plate);border-radius:16px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;}
.install-banner .txt{flex:1;font-size:14px;line-height:1.4;}
.install-banner .txt b{display:block;font-size:15px;margin-bottom:2px;}
.install-banner button{white-space:nowrap;background:var(--paprika);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-family:'Nunito',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
.installed-badge{display:inline-flex;align-items:center;gap:6px;background:var(--herb);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;}
.ios-steps{background:var(--plate);border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:14px;line-height:1.6;}
.ios-steps b{display:block;margin-bottom:4px;}
.ios-steps .close{float:right;background:none;border:none;font-size:14px;color:#8a7260;cursor:pointer;}

/* ---- Wizard ---- */
.wizard{display:flex;flex-direction:column;gap:16px;padding-top:10px;}
.wizard h2{font-family:'Lora',serif;font-style:italic;font-weight:600;font-size:24px;margin:0 0 4px;}
.wizard p{line-height:1.5;margin:0;color:#6B5443;}
.step-dots{display:flex;gap:6px;margin-bottom:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--paprika);}
input[type=text],input[type=password]{
  width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  font-family:'Nunito',sans-serif;font-size:16px;background:#fff;color:var(--plum);}
input:focus{outline:none;border-color:var(--paprika);}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;
  font-family:'Nunito',sans-serif;font-weight:600;font-size:17px;cursor:pointer;
  background:var(--paprika);color:#fff;box-shadow:0 6px 16px rgba(224,86,56,.3);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--paprika);box-shadow:none;border:2px solid var(--paprika);}
.btn:disabled{background:#D8C7B4;box-shadow:none;cursor:not-allowed;}
.ok-badge{display:flex;align-items:center;gap:8px;color:var(--herb-dark);font-weight:600;font-size:14px;}
.bad-badge{color:var(--paprika-dark);font-size:14px;font-weight:600;}
ol.howto{padding-left:20px;margin:0;line-height:1.7;color:#6B5443;}
ol.howto li{margin-bottom:4px;}
a.link{color:var(--paprika-dark);font-weight:600;}

/* ---- Main app ---- */
.shutter-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 22px;}
.shutter{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4805F,var(--paprika) 60%,var(--paprika-dark));
  border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(224,86,56,.4);cursor:pointer;}
.shutter svg{width:46px;height:46px;}
.shutter-label{font-size:14px;color:#6B5443;}
.thumb{width:100%;border-radius:16px;margin-bottom:14px;max-height:160px;object-fit:cover;}

.add-row{display:flex;gap:8px;margin-bottom:14px;}
.add-row input{flex:1;}
.add-row button{width:52px;border-radius:14px;border:none;background:var(--herb);color:#fff;font-size:22px;cursor:pointer;}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{background:var(--plate);padding:8px 10px 8px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:14px;}
.chip button{border:none;background:rgba(0,0,0,.08);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;color:var(--plum);}

.cook-btn{position:sticky;bottom:16px;}

/* ---- Loading ---- */
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 10px;text-align:center;}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--paprika);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:#6B5443;font-size:15px;}

/* ---- Recipe card ---- */
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(58,36,24,.08);margin-bottom:20px;}
.card h2{font-family:'Lora',serif;font-weight:600;font-size:26px;margin:0 0 6px;line-height:1.2;}
.card .desc{color:#6B5443;font-size:15px;line-height:1.5;margin:0 0 14px;}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.meta{background:var(--cream);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--plum);display:flex;gap:6px;align-items:center;}
.card h3{font-size:15px;margin:18px 0 8px;color:var(--paprika-dark);}
.card ul{margin:0;padding-left:18px;line-height:1.8;}
.card ol{margin:0;padding-left:20px;line-height:1.9;}
.again{margin-top:4px;}
.error{background:#FBDFD6;color:var(--paprika-dark);padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.5;margin-bottom:14px;}
.intro{line-height:1.55;color:#6B5443;margin:4px 0 0;}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.th{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--plate);}
.th img{width:100%;height:100%;object-fit:cover;display:block;}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(58,36,24,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer;}
.hint{font-size:13px;color:#6B5443;margin-bottom:14px;}
.used{background:var(--plate);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:10px;color:#6B5443;}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:#6B5443;margin-top:22px;}
.list-title{font-weight:700;font-size:15px;margin:4px 0 8px;}
.list-title span{font-weight:500;font-size:12px;color:#9A8370;}
.idea{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(58,36,24,.07);cursor:pointer;border:2px solid transparent;}
.idea:active{border-color:var(--paprika);}
.idea-t{font-family:'Lora',serif;font-weight:600;font-size:19px;margin-bottom:4px;}
.idea-d{color:#6B5443;font-size:14px;line-height:1.45;margin-bottom:8px;}
.idea-m{font-size:13px;font-weight:600;color:var(--paprika-dark);}
footer.settings-link{text-align:center;padding:10px 0 30px;}
footer.settings-link a{color:#9A8370;font-size:13px;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const $ = (sel,el=document)=>el.querySelector(sel);
const app = $('#app');
const store = {
  get:(k)=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},
  set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},
};

// ---------- egyszerű licenckód-ellenőrzés (prototípus szint) ----------
// Formátum: HM-XXXX-XXXX-C , ahol C egy ellenőrző karakter a 8 betű/számjegyből számolva.
// Ez nem feltörhetetlen titkosítás, csak megakadályozza, hogy bárki random kódot írjon be,
// és időigényessé teszi a kitalálást. Éles verzióban digitális aláírással (pl. Ed25519) érdemes kiváltani.
function checkDigit(body){
  let sum=0; for(const ch of body){ sum = (sum*31 + ch.charCodeAt(0)) % 36; }
  return sum.toString(36).toUpperCase();
}
function isValidLicense(code){
  code = code.trim().toUpperCase();
  const m = code.match(/^HM-([A-Z0-9]{4})-([A-Z0-9]{4})-([A-Z0-9])$/);
  if(!m) return false;
  const body = m[1]+m[2];
  return checkDigit(body) === m[3];
}

// ---------- Gemini API segédfüggvények ----------
const GEM_TIMEOUT = 40000;
const GEM_API = 'https://generativelanguage.googleapis.com/v1beta';
async function gemListModels(key){
  const r = await fetch(`${GEM_API}/models?pageSize=1000&key=${encodeURIComponent(key)}`);
  let data = {}; try{ data = await r.json(); }catch(e){}
  return {ok:r.ok, status:r.status, data};
}
// A Google élő modell-listájából választ stabil "flash" modelleket (sorrendben), így a lejárt modellnevek nem törik el az appot.
function gemCandidates(models){
  const names = (models||[])
    .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>String(m.name||'').replace(/^models\//,''))
    .filter(n=>/^gemini-/.test(n) && /flash/.test(n) &&
      !/(preview|exp|tts|image|live|audio|thinking|robotics|computer|embedding|customtools|-\d{3}$)/.test(n));
  // Gyors (lite) modellek előre: a recepthez nem kell nagy "gondolkodó" modell. Az alias (-latest) a végére kerül.
  const score = n=>{ const v=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
    return (/lite/.test(n)?1000:0) + (/latest/.test(n)?-500:0) + v*10; };
  names.sort((a,b)=>score(b)-score(a));
  return names;
}
function gemPickModel(models){ return gemCandidates(models)[0] || ''; }
function gemExplain(status, data){
  const msg = (data && data.error && data.error.message) || '';
  const st  = (data && data.error && data.error.status) || '';
  if(/API key not valid|API_KEY_INVALID|API key expired/i.test(msg) || status===401) return 'A Google szerint ez a kulcs érvénytelen. Másold be újra az AI Studióból, és ügyelj rá, hogy ne maradjon szóköz a végén.';
  if(status===403) return 'A kulcsot a Google elutasította (hozzáférés megtagadva). Hozz létre egy új kulcsot az AI Studióban.';
  if(status===429 || st==='RESOURCE_EXHAUSTED' || /quota/i.test(msg)) return 'Elfogyott az ingyenes keret. Próbáld meg később vagy holnap újra.';
  if(status===503 || /overloaded|high demand|UNAVAILABLE/i.test(msg+st)) return 'A Google AI-szervere most túlterhelt (ez náluk átmeneti). Várj egy-két percet, és próbáld újra.';
  if(status===404) return 'A használt AI-modell nem érhető el. Nyisd meg a kulcs-beállítást, és teszteld újra a kulcsot.';
  return 'A Google hibát jelzett (' + status + '): ' + (msg || 'ismeretlen hiba');
}
async function gemEnsureModels(key, force){
  // Mindig friss listát kér (olcsó, gyors hívás); csak hálózati hiba esetén használja a mentettet.
  try{
    const res = await gemListModels(key);
    if(res.ok){
      const c = gemCandidates(res.data.models);
      if(c.length){ store.set('hm_models', JSON.stringify(c)); return c; }
    } else if(res.status===400 || res.status===401 || res.status===403){
      throw {gem:true, status:res.status, data:res.data};
    }
  }catch(e){ if(e && e.gem) throw e; }
  try{ const c=JSON.parse(store.get('hm_models')||'[]'); if(c.length) return c; }catch(e){}
  throw {gem:true, status:404, data:{}};
}
// Kép kicsinyítése: a telefonos fotó 5-10 MB, ez túl lassú és hibákat okoz. 1024 px-es JPEG bőven elég az étel felismeréséhez.
function shrinkImage(file, maxSide=1024, quality=0.8){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, maxSide/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve({mime:'image/jpeg', data:c.toDataURL('image/jpeg',quality).split(',')[1]});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

// ---------- Frissítés-értesítés ----------
// Új kiadásnál csak az APP_VERSION értékét kell megnövelni (pl. '3'), a vevők pedig értesítést kapnak.
// A licenckód és az API-kulcs a böngésző tárolójában marad, a frissítés ezekhez nem nyúl.
const APP_VERSION = '8';
async function checkForUpdate(){
  try{
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([^']*)'/);
    if(m && m[1] !== APP_VERSION && !state.updateAvail){ state.updateAvail = m[1]; render(); }
  }catch(e){ /* offline: nem baj */ }
}
async function applyUpdate(){
  try{ if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ await fetch(location.pathname, {cache:'reload'}); }catch(e){}
  location.reload();
}
function updateBanner(){
  const el = h(`
    <div class="install-banner" style="margin:12px 20px 0;">
      <div class="txt"><b>Új frissítés érhető el 🎉</b>Verzió: v${APP_VERSION} → <b style="display:inline;color:var(--paprika-dark)">v${state.updateAvail}</b><br>A kulcsaid megmaradnak.</div>
      <button>Frissítés</button>
    </div>`);
  el.querySelector('button').onclick = applyUpdate;
  return el;
}

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setStatus(t){ state.status=t; const el=document.getElementById('loadMsg'); if(el) el.textContent=t; }
let state = {
  screen: store.get('hm_license') && store.get('hm_apikey') ? 'home' : 'license',
  image: null, // {mime, data}
  ingredients: [],
  recipe: null,
  loading: false,
  error: '',
  tmpLicense:'', tmpKey:'', tmpModel:'', status:'', errDetail:'', loadText:'', ideas:null, photos:[], prevTitles:[], keyTestMsg:'', keyTestOk:false,
  showIosSteps: false, updateAvail:'',
};

// ---------- Telepítés (PWA) ----------
let deferredInstallPrompt = null;
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  render();
});

function installBanner(){
  if(isStandalone()){
    return h(`<div class="install-banner"><div class="installed-badge">✅ Telepítve a telefonra</div></div>`);
  }
  if(deferredInstallPrompt){
    const el = h(`
      <div class="install-banner">
        <div class="txt"><b>Tedd ki a kezdőképernyőre</b>Egy koppintással mindig kéznél lesz.</div>
        <button>Telepítés</button>
      </div>`);
    el.querySelector('button').onclick = async ()=>{
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      render();
    };
    return el;
  }
  if(isIOS()){
    if(state.showIosSteps){
      const el = h(`
        <div class="ios-steps">
          <button class="close">✕</button>
          <b>Így teheted ki a kezdőképernyőre:</b>
          1. Koppints a Megosztás gombra (⬆️) lent<br>
          2. Görgess le, és válaszd: „Kezdőképernyőhöz adás”<br>
          3. Koppints: „Hozzáadás”
        </div>`);
      el.querySelector('.close').onclick = ()=>{ state.showIosSteps=false; render(); };
      return el;
    }
    const el = h(`
      <div class="install-banner">
        <div class="txt"><b>Tedd ki a kezdőképernyőre</b>Egy koppintással mindig kéznél lesz.</div>
        <button>Mutasd, hogyan</button>
      </div>`);
    el.querySelector('button').onclick = ()=>{ state.showIosSteps=true; render(); };
    return el;
  }
  return null;
}

function render(){
  app.innerHTML = '';
  if(state.screen==='license') app.appendChild(viewLicense());
  else if(state.screen==='apikey') app.appendChild(viewApiKey());
  else app.appendChild(viewHome());
  if(state.updateAvail) app.prepend(updateBanner());
}

function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

// ---------- 1. képernyő: licenckód ----------
function viewLicense(){
  const el = h(`
    <div class="app">
      <header><h1>Hűtő <span>Mágus</span></h1></header>
      <main>
        <div class="wizard">
          <div class="step-dots"><div class="dot on"></div><div class="dot"></div></div>
          <h2>Üdv a konyhában!</h2>
          <p>Add meg a vásárláskor kapott licenckódot az aktiváláshoz. A levélben találod, formátuma: HM-XXXX-XXXX-X</p>
          <input type="text" id="lic" placeholder="HM-ABCD-1234-X" autocapitalize="characters">
          <div id="licMsg"></div>
          <button class="btn" id="licBtn">Aktiválás</button>
        </div>
      </main>
    </div>`);
  const input = el.querySelector('#lic');
  const msg = el.querySelector('#licMsg');
  el.querySelector('#licBtn').onclick = ()=>{
    if(isValidLicense(input.value)){
      store.set('hm_license', input.value.trim().toUpperCase());
      state.screen = store.get('hm_apikey') ? 'home' : 'apikey';
      render();
    } else {
      msg.innerHTML = '<div class="bad-badge">Ez a kód nem stimmel. Nézd meg, mindent jól írtál-e be.</div>';
    }
  };
  return el;
}

// ---------- 2. képernyő: API kulcs varázsló ----------
function viewApiKey(){
  const el = h(`
    <div class="app">
      <header><h1>Hűtő <span>Mágus</span></h1></header>
      <main>
        <div class="wizard">
          <div class="step-dots"><div class="dot on"></div><div class="dot on"></div></div>
          <h2>Már csak egy lépés</h2>
          <p>Az AI, ami a recepteket kitalálja, ingyenes — de kell hozzá egy saját kulcs. Ez egyszer kell, utána minden megy magától.</p>
          <p style="font-size:13px;">Fontos: a Google <b>ingyenes</b> AI-ját használjuk, nem a legerősebb (fizetős) változatot. Jól működik, de néha téved — ezért a fotók alapján készült listát te is átnézheted és javíthatod.</p>
          <ol class="howto">
            <li>Nyisd meg: <a class="link" href="https://aistudio.google.com/app/apikey?hl=hu" target="_blank" rel="noopener">aistudio.google.com</a></li>
            <li>Jelentkezz be a Google-fiókoddal</li>
            <li>Kattints: <b>Create API key</b></li>
            <li>Másold ide az alábbi mezőbe</li>
          </ol>
          <p style="font-size:13px;color:#8a7260;">Ha a Google oldala esetleg nem magyarul jönne be, az nem baj — a gombok ugyanott vannak, csak kövesd a fenti sorrendet.</p>
          <input type="password" id="key" placeholder="Illeszd be ide a kulcsot">
          <div id="keyMsg"></div>
          <button class="btn ghost" id="testBtn">Kulcs tesztelése</button>
          <button class="btn" id="goBtn" disabled>Kész, irány a konyha!</button>
        </div>
      </main>
    </div>`);
  const input = el.querySelector('#key');
  const msg = el.querySelector('#keyMsg');
  const goBtn = el.querySelector('#goBtn');
  el.querySelector('#testBtn').onclick = async ()=>{
    const k = input.value.trim();
    if(!k){ msg.innerHTML = '<div class="bad-badge">Illeszd be a kulcsot előbb.</div>'; return; }
    msg.innerHTML = '<div class="bad-badge">Tesztelés…</div>';
    try{
      const res = await gemListModels(k);
      if(!res.ok){
        msg.innerHTML = '<div class="bad-badge">'+gemExplain(res.status,res.data)+'</div>';
        return;
      }
      const model = gemPickModel(res.data.models);
      if(!model){
        msg.innerHTML = '<div class="bad-badge">A kulcs érvényes, de nem találtam hozzá használható AI-modellt.</div>';
        return;
      }
      state.tmpModel = JSON.stringify(gemCandidates(res.data.models));
      msg.innerHTML = '<div class="ok-badge">✅ A kulcs működik!</div>';
      goBtn.disabled = false;
      state.tmpKey = k;
    }catch(e){
      msg.innerHTML = '<div class="bad-badge">Nem sikerült elérni a Google szerverét. Ellenőrizd az internetkapcsolatot.</div>';
    }
  };
  goBtn.onclick = ()=>{
    store.set('hm_apikey', state.tmpKey);
    store.set('hm_models', state.tmpModel||'');
    state.screen='home'; render();
  };
  return el;
}

// ---------- AI-hívás (közös): modellváltás, időkorlát, újrapróbálkozás ----------
async function gemJSON(parts){
  const key = store.get('hm_apikey');
  const thinkingFor = (model)=>{
    if(/gemini-2\.5-flash$/.test(model)) return {thinkingBudget:0};
    if(/gemini-3|latest/.test(model)) return {thinkingLevel:'low'};
    return null;
  };
  const rawCall = async (model, withThinking)=>{
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), GEM_TIMEOUT);
    try{
      const gc = {responseMimeType:'application/json'};
      const th = withThinking ? thinkingFor(model) : null;
      if(th) gc.thinkingConfig = th;
      const r = await fetch(`${GEM_API}/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{
        method:'POST', headers:{'Content-Type':'application/json'}, signal:ctl.signal,
        body: JSON.stringify({contents:[{parts}], generationConfig:gc})
      });
      let d = {}; try{ d = await r.json(); }catch(e){}
      return {r, d};
    } finally { clearTimeout(timer); }
  };
  const call = async (model)=>{
    const res = await rawCall(model, true);
    if(res.r.status===400 && thinkingFor(model)) return await rawCall(model, false);
    return res;
  };
  let models;
  try{ models = await gemEnsureModels(key, false); }
  catch(e){ throw {msg: e && e.gem ? gemExplain(e.status, e.data) : 'Nem sikerült elérni a Google-t.', detail:''}; }
  let r, data, last=null, tried=0, refreshed=false;
  const log = [];
  const t0 = Date.now();
  const tick = setInterval(()=>{ if(state.status) setStatus(state.status.replace(/ · \d+ mp$/,'') + ' · ' + Math.round((Date.now()-t0)/1000) + ' mp'); }, 1000);
  try{
    for(let i=0; i<models.length && tried<4; i++){
      tried++;
      setStatus(`Próbálkozás ${tried}/4 · ${models[i]}`);
      const ta = Date.now();
      try{ ({r, d:data} = await call(models[i])); }
      catch(e){ last = {status:0}; log.push(`${models[i]}: nincs válasz (${Math.round((Date.now()-ta)/1000)} mp)`); continue; }
      if(r.ok) break;
      last = {status:r.status, data};
      log.push(`${models[i]}: ${r.status} ${(data&&data.error&&data.error.message||'').slice(0,160)} (${Math.round((Date.now()-ta)/1000)} mp)`);
      if(r.status===404 && !refreshed){ refreshed=true; models = await gemEnsureModels(key, true); i=-1; tried=0; continue; }
      if([500,502,503,504,404].includes(r.status)){ await new Promise(res=>setTimeout(res, 1500)); continue; }
      break;
    }
  } finally { clearInterval(tick); }
  const detail = log.join(' | ') + (models.length ? ' || lista: ' + models.slice(0,6).join(', ') : '');
  if(!r || !r.ok){
    throw {detail, msg: (last && last.status===0)
      ? 'A Google most nem válaszolt időben. Próbáld újra egy perc múlva.'
      : gemExplain(last ? last.status : 0, last ? last.data : {})};
  }
  try{
    let txt = data.candidates[0].content.parts[0].text.trim();
    txt = txt.replace(/^```json\s*|```$/g,'').trim();
    return JSON.parse(txt);
  }catch(e){
    throw {detail: detail + ' | feldolgozási hiba: ' + (e && e.message), msg:'A válasz nem volt értelmezhető. Próbáld újra.'};
  }
}
// Futtat egy AI-feladatot töltőképernyővel; hiba esetén kiírja a hibát, és null-t ad vissza.
async function runAI(loadText, parts){
  state.loading = true; state.error=''; state.errDetail=''; state.loadText=loadText; state.status='Kapcsolódás a Google-hez…'; render();
  try{
    const out = await gemJSON(parts);
    state.loading = false; return out;
  }catch(e){
    state.loading = false;
    state.error = (e && e.msg) || 'Valami elakadt. Próbáld újra.';
    state.errDetail = (e && e.detail) || (e && e.message) || '';
    render(); return null;
  }
}
function errBox(){
  if(!state.error) return null;
  return h(`<div class="error">${esc(state.error)}${state.errDetail?`<div style="margin-top:8px;font-size:11px;opacity:.8;word-break:break-word;">Műszaki részlet (v${APP_VERSION}): ${esc(state.errDetail)}</div>`:''}</div>`);
}

// ---------- 1. lépés: fotók → felismert alapanyagok (csak a "Receptötletek" gombra indul) ----------
async function detectIngredients(){
  const imgs = state.photos.map(im=>({inline_data:{mime_type:im.mime, data:im.data}}));
  const out = await runAI(state.photos.length>1 ? 'A Hűtő Mágus most nézi át a fotóidat…' : 'A Hűtő Mágus most nézi át, mi lapul a polcokon…', [
    ...imgs,
    {text:`Nézd meg ${imgs.length>1?'ezeket a fotókat':'ezt a fotót'}, és sorold fel a rajtuk látható ÉTELEKET és ALAPANYAGOKAT (hűtő vagy kamra tartalma).
Szabályok: csak ehető dolgokat írj; ne találgass, ha valami nem látszik biztosan; magyarul, rövid, alapalakban (pl. "tojás", "tejföl", "sárgarépa"); ugyanazt ne ismételd (a fotók között sem); legfeljebb 50 tétel.
Válaszolj KIZÁRÓLAG ebben a JSON formátumban: {"items":["tojás","tej"]}`}]);
  if(!out) return false;                      // hiba: a fotók megmaradnak, újra lehet próbálni
  const items = Array.isArray(out.items) ? out.items.map(x=>String(x).trim()).filter(Boolean) : [];
  const have = new Set(state.ingredients.map(x=>x.toLowerCase()));
  items.forEach(x=>{ if(!have.has(x.toLowerCase())){ state.ingredients.push(x); have.add(x.toLowerCase()); } });
  state.photos = [];                          // feldolgozva, a lista tartalmazza őket
  if(!items.length && !state.ingredients.length){
    state.error = 'Nem ismertem fel ételt a fotókon. Fotózz közelebbről, vagy írd be kézzel a hozzávalókat.'; state.errDetail=''; render(); return false;
  }
  return true;
}
async function startIdeas(){
  state.prevTitles = [];
  if(state.photos.length){ const ok = await detectIngredients(); if(!ok) return; }
  await suggestIdeas();
}

// ---------- 2. lépés: hozzávalók → receptötletek ----------
async function suggestIdeas(){
  const avoid = state.prevTitles.length ? `\nEzeket az ötleteket már láttuk, ezeket NE ismételd: ${state.prevTitles.join('; ')}.` : '';
  const out = await runAI('Receptötleteken gondolkodom…', [{text:`Ezek az alapanyagok vannak otthon: ${state.ingredients.join(', ')}.
Adj 5 különböző, változatos receptötletet, amit egy háziasszony egyszerűen elkészíthet. Főként ezekből dolgozz; alap konyhai dolgokat (só, bors, olaj, víz, liszt, cukor) feltételezhetsz.${avoid}
Válaszolj KIZÁRÓLAG ebben a JSON formátumban: {"ideas":[{"title":"étel neve","description":"1 mondatos csábító leírás","time":"kb. 20 perc"}]}`}]);
  if(!out) return;
  const ideas = Array.isArray(out.ideas) ? out.ideas.filter(x=>x && x.title) : [];
  if(!ideas.length){ state.error='Most nem sikerült ötletet találni. Próbáld újra.'; render(); return; }
  state.ideas = ideas; ideas.forEach(i=>state.prevTitles.push(i.title)); render();
}

// ---------- 3. lépés: kiválasztott ötlet → teljes recept ----------
async function makeRecipe(idea){
  const out = await runAI('Elkészítem a receptet…', [{text:`Írd meg a teljes receptet ehhez: "${idea.title}" (${idea.description||''}).
Rendelkezésre álló alapanyagok: ${state.ingredients.join(', ')}. Alap konyhai dolgokat (só, bors, olaj, víz, liszt, cukor) feltételezhetsz. Egyszerű, barátságos, lépésről lépésre.
Válaszolj KIZÁRÓLAG ebben a JSON formátumban:
{"title":"recept neve","description":"1-2 mondatos csábító leírás","time":"kb. 20 perc","servings":"4 adag","tool":"serpenyő / sütő / szendvicssütő / tűzhely - amelyik kell","ingredients":["hozzávaló mennyiséggel"],"steps":["1. lépés","2. lépés"]}`}]);
  if(!out) return;
  if(!out.title || !Array.isArray(out.ingredients) || !Array.isArray(out.steps)){ state.error='A recept hiányos lett. Próbáld újra.'; render(); return; }
  state.recipe = out; render();
}

// ---------- Főképernyő ----------
function viewHome(){
  const el = h(`
    <div class="app">
      <header><h1>Hűtő <span>Mágus</span></h1></header>
      <main id="homeMain"></main>
      <footer class="settings-link"><a id="resetLink">Kulcsok újra beállítása</a><div style="margin-top:8px;font-size:12px;color:#B3A08C;">Verzió: v${APP_VERSION}</div></footer>
    </div>`);
  el.querySelector('#resetLink').onclick = ()=>{
    if(confirm('Biztosan töröljük a mentett kulcsokat?')){
      store.set('hm_license',''); store.set('hm_apikey',''); store.set('hm_models','');
      state = {...state, screen:'license'}; render();
    }
  };
  const main = el.querySelector('#homeMain');

  const banner = installBanner();
  if(banner) main.appendChild(banner);

  if(state.loading){ main.appendChild(viewLoading()); return el; }
  if(state.recipe){ main.appendChild(viewRecipe()); return el; }
  if(state.ideas){ main.appendChild(viewIdeas()); return el; }

  const eb = errBox(); if(eb) main.appendChild(eb);

  const hasAny = state.photos.length || state.ingredients.length;
  if(!hasAny){
    main.appendChild(h(`<p class="intro">Fotózd le a hűtőt vagy a kamrát — annyi fotót, amennyit csak szeretnél —, és kézzel is hozzáadhatsz dolgokat (pl. ami a spájzban van). Ha kész vagy, koppints a <b>Receptötletek</b> gombra.</p>`));
  }

  main.appendChild(h(`
    <div class="shutter-wrap">
      <button class="shutter" id="camBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#fff" stroke-width="1.8"/></svg>
      </button>
      <div class="shutter-label">${hasAny ? 'Még egy fotó (hűtő, kamra, spájz…)' : 'Fotózd le a hűtőt vagy a kamrát'}</div>
      <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
    </div>`));
  el.querySelector('#camBtn').onclick = ()=> el.querySelector('#camInput').click();
  el.querySelector('#camInput').onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    if(state.photos.length >= 6){ state.error='Egyszerre legfeljebb 6 fotót tudok feldolgozni. Koppints a Receptötletek gombra, utána még hozzáadhatsz újakat.'; state.errDetail=''; render(); return; }
    shrinkImage(f).then(img=>{ state.photos.push(img); state.error=''; render(); })
      .catch(()=>{ state.error='Ezt a fotót nem sikerült betölteni. Próbálj egy másikat.'; state.errDetail=''; render(); });
  };

  if(state.photos.length){
    const row = h('<div class="thumbs"></div>');
    state.photos.forEach((im,i)=>{
      const t = h(`<div class="th"><img src="data:${im.mime};base64,${im.data}"><button aria-label="Fotó törlése">✕</button></div>`);
      t.querySelector('button').onclick = ()=>{ state.photos.splice(i,1); render(); };
      row.appendChild(t);
    });
    main.appendChild(row);
    main.appendChild(h(`<div class="hint">${state.photos.length} fotó vár feldolgozásra — a Receptötletek gombra nézem át őket.</div>`));
  }

  if(state.ingredients.length){
    main.appendChild(h(`<div class="list-title">Hozzávalók <span>(koppints az ✕-re a törléshez)</span></div>`));
    const chips = h('<div class="chips"></div>');
    state.ingredients.forEach((ing,i)=>{
      const chip = h(`<div class="chip">${esc(ing)}<button>✕</button></div>`);
      chip.querySelector('button').onclick = ()=>{ state.ingredients.splice(i,1); render(); };
      chips.appendChild(chip);
    });
    main.appendChild(chips);
  }

  main.appendChild(h(`
    <div class="add-row">
      <input type="text" id="ingInput" placeholder="${hasAny ? 'Mi hiányzik? Írd be, és koppints a +-ra' : 'vagy írd be kézzel, pl. krumpli, tojás'}">
      <button id="ingAdd">+</button>
    </div>`));
  const ingInput = el.querySelector('#ingInput');
  const addIng = ()=>{
    const v = ingInput.value.trim(); if(!v) return;
    v.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{
      if(!state.ingredients.some(y=>y.toLowerCase()===x.toLowerCase())) state.ingredients.push(x);
    });
    ingInput.value=''; render();
  };
  el.querySelector('#ingAdd').onclick = addIng;
  ingInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addIng(); } };

  const canGo = hasAny;
  const goBtn = h(`<button class="btn cook-btn" ${canGo?'':'disabled'}>${state.prevTitles.length ? 'Új receptötletek ✨' : 'Receptötletek ✨'}</button>`);
  goBtn.onclick = startIdeas;
  main.appendChild(goBtn);

  main.appendChild(h(`<div class="note"><b>Jó tudni:</b> a Hűtő Mágus a Google <b>ingyenes</b> AI-ját használja, nem a legerősebbet — az fizetős lenne, és akkor a használat sem lehetne ingyenes. Jól használható, de néha téved vagy kihagy valamit a fotókról. Ezért nézd át a listát, javítsd ki, és a receptet főzés előtt ellenőrizd (különösen allergia esetén).</div>`));

  return el;
}

function viewLoading(){
  return h(`<div class="loading"><div class="spin"></div><p>${esc(state.loadText||'Egy pillanat…')}</p><p id="loadMsg" style="font-size:12px;color:#9A8370;">${esc(state.status||'')}</p></div>`);
}

function viewIdeas(){
  const wrap = h(`<div></div>`);
  const eb = errBox(); if(eb) wrap.appendChild(eb);
  wrap.appendChild(h(`<div class="used"><b>Ezekből:</b> ${esc(state.ingredients.join(', '))}</div>`));
  wrap.appendChild(h(`<div class="list-title" style="margin-top:6px;">Ezeket főzhetnéd <span>(koppints egyre a teljes receptért)</span></div>`));
  state.ideas.forEach(idea=>{
    const c = h(`<div class="idea"><div class="idea-t">${esc(idea.title)}</div><div class="idea-d">${esc(idea.description||'')}</div><div class="idea-m">⏱ ${esc(idea.time||'')}</div></div>`);
    c.onclick = ()=> makeRecipe(idea);
    wrap.appendChild(c);
  });
  const more = h(`<button class="btn ghost again">Más ötleteket kérek ugyanezekből</button>`);
  more.onclick = suggestIdeas; wrap.appendChild(more);
  const back = h(`<button class="btn ghost again" style="margin-top:10px;">＋ Hozzávalók bővítése / szerkesztése</button>`);
  back.onclick = ()=>{ state.ideas=null; state.error=''; render(); }; wrap.appendChild(back);
  return wrap;
}

function viewRecipe(){
  const r = state.recipe;
  const wrap = h(`<div></div>`);
  wrap.appendChild(h(`
    <div class="card">
      <h2>${esc(r.title)}</h2>
      <p class="desc">${esc(r.description)}</p>
      <div class="meta-row">
        <div class="meta">⏱ ${esc(r.time)}</div>
        <div class="meta">🍽 ${esc(r.servings)}</div>
        <div class="meta">🔥 ${esc(r.tool)}</div>
      </div>
      <h3>Hozzávalók</h3>
      <ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      <h3>Elkészítés</h3>
      <ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    </div>`));
  const back = h(`<button class="btn ghost again">← Vissza az ötletekhez</button>`);
  back.onclick = ()=>{ state.recipe=null; state.error=''; render(); };
  wrap.appendChild(back);
  const again = h(`<button class="btn ghost again" style="margin-top:10px;">Új hűtő / kamra</button>`);
  again.onclick = ()=>{ state.recipe=null; state.ideas=null; state.photos=[]; state.prevTitles=[]; state.ingredients=[]; state.error=''; render(); };
  wrap.appendChild(again);
  return wrap;
}

render();
checkForUpdate();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(); });

if('serviceWorker' in navigator){
  // nincs külön service worker fájl, de a manifest önmagában is telepíthetővé teszi
}
</script>
