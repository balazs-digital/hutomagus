<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="9">
<title>Hűtő Mágus</title>
<meta name="description" content="Fotózd le a hűtőd, és kapj egy gusztusos receptet pillanatok alatt.">
<meta name="theme-color" content="#E05638">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hűtő Mágus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paprika:#E05638; --paprika-dark:#B8402A; --cream:#FBF1E4; --plate:#FDE3C8;
  --plum:#3A2418; --herb:#6B8E4E; --herb-dark:#4F6B38; --line:#EBD7B8;
  color-scheme: light;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--plum);font-family:'Nunito',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
header{padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:22px;margin:0;}
header h1 span{color:var(--paprika);}
main{flex:1;padding:0 20px 40px;}

/* ---- Telepítés ---- */
.install-banner{background:var(--plate);border-radius:16px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;}
.install-banner .txt{flex:1;font-size:14px;line-height:1.4;}
.install-banner .txt b{display:block;font-size:15px;margin-bottom:2px;}
.install-banner button{white-space:nowrap;background:var(--paprika);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-family:'Nunito',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
.installed-badge{display:inline-flex;align-items:center;gap:6px;background:var(--herb);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;}
.ios-steps{background:var(--plate);border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:14px;line-height:1.6;}
.ios-steps b{display:block;margin-bottom:4px;}
.ios-steps .close{float:right;background:none;border:none;font-size:14px;color:#8a7260;cursor:pointer;}

/* ---- Wizard ---- */
.wizard{display:flex;flex-direction:column;gap:16px;padding-top:10px;}
.wizard h2{font-family:'Lora',serif;font-style:italic;font-weight:600;font-size:24px;margin:0 0 4px;}
.wizard p{line-height:1.5;margin:0;color:#6B5443;}
.step-dots{display:flex;gap:6px;margin-bottom:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--paprika);}
input[type=text],input[type=password]{
  width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  font-family:'Nunito',sans-serif;font-size:16px;background:#fff;color:var(--plum);}
input:focus{outline:none;border-color:var(--paprika);}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;
  font-family:'Nunito',sans-serif;font-weight:600;font-size:17px;cursor:pointer;
  background:var(--paprika);color:#fff;box-shadow:0 6px 16px rgba(224,86,56,.3);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--paprika);box-shadow:none;border:2px solid var(--paprika);}
.btn:disabled{background:#D8C7B4;box-shadow:none;cursor:not-allowed;}
.ok-badge{display:flex;align-items:center;gap:8px;color:var(--herb-dark);font-weight:600;font-size:14px;}
.bad-badge{color:var(--paprika-dark);font-size:14px;font-weight:600;}
ol.howto{padding-left:20px;margin:0;line-height:1.7;color:#6B5443;}
ol.howto li{margin-bottom:4px;}
a.link{color:var(--paprika-dark);font-weight:600;}

/* ---- Main app ---- */
.shutter-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 22px;}
.shutter{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4805F,var(--paprika) 60%,var(--paprika-dark));
  border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(224,86,56,.4);cursor:pointer;}
.shutter svg{width:46px;height:46px;}
.shutter-label{font-size:14px;color:#6B5443;}
.thumb{width:100%;border-radius:16px;margin-bottom:14px;max-height:160px;object-fit:cover;}

.add-row{display:flex;gap:8px;margin-bottom:14px;}
.add-row input{flex:1;}
.add-row button{width:52px;border-radius:14px;border:none;background:var(--herb);color:#fff;font-size:22px;cursor:pointer;}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{background:var(--plate);padding:8px 10px 8px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:14px;}
.chip button{border:none;background:rgba(0,0,0,.08);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;color:var(--plum);}

.cook-btn{position:sticky;bottom:16px;}

/* ---- Loading ---- */
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 10px;text-align:center;}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--paprika);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:#6B5443;font-size:15px;}

/* ---- Recipe card ---- */
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(58,36,24,.08);margin-bottom:20px;}
.card h2{font-family:'Lora',serif;font-weight:600;font-size:26px;margin:0 0 6px;line-height:1.2;}
.card .desc{color:#6B5443;font-size:15px;line-height:1.5;margin:0 0 14px;}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.meta{background:var(--cream);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--plum);display:flex;gap:6px;align-items:center;}
.card h3{font-size:15px;margin:18px 0 8px;color:var(--paprika-dark);}
.card ul{margin:0;padding-left:18px;line-height:1.8;}
.card ol{margin:0;padding-left:20px;line-height:1.9;}
.again{margin-top:4px;}
.error{background:#FBDFD6;color:var(--paprika-dark);padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.5;margin-bottom:14px;}
.intro{line-height:1.55;color:#6B5443;margin:4px 0 0;}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.th{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--plate);}
.th img{width:100%;height:100%;object-fit:cover;display:block;}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(58,36,24,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer;}
.hint{font-size:13px;color:#6B5443;margin-bottom:14px;}
.used{background:var(--plate);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:10px;color:#6B5443;}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:#6B5443;margin-top:22px;}
.list-title{font-weight:700;font-size:15px;margin:4px 0 8px;}
.list-title span{font-weight:500;font-size:12px;color:#9A8370;}
.idea{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(58,36,24,.07);cursor:pointer;border:2px solid transparent;}
.idea:active{border-color:var(--paprika);}
.idea-t{font-family:'Lora',serif;font-weight:600;font-size:19px;margin-bottom:4px;}
.idea-d{color:#6B5443;font-size:14px;line-height:1.45;margin-bottom:8px;}
.idea-m{font-size:13px;font-weight:600;color:var(--paprika-dark);}
.lic-badge{border:none;border-radius:999px;padding:7px 12px;background:var(--plate);color:var(--plum);font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.lic-badge.ok{background:var(--herb);color:#fff;}
.notice{margin:12px 20px 0;background:#E4F0DA;color:#3C5A27;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.45;cursor:pointer;}
.notice.bad{background:#FBDFD6;color:var(--paprika-dark);}
textarea{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-family:'Nunito',sans-serif;font-size:14px;background:#fff;color:var(--plum);min-height:84px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--paprika);}
footer.settings-link{text-align:center;padding:10px 0 30px;}
footer.settings-link a{color:#9A8370;font-size:13px;text-decoration:underline;cursor:pointer;}
</style>
</head>
